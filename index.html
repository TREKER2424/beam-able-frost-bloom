м матче, даже если отец запретит.`},{name:`Вася`,text:`Я не уеду в середине сезона. И не брошу, если таблица станет некрасивой. Сегодня я забираю это место.`}]},{kind:`talk`,title:`Кухня`,place:`Дом Ивановых, поздно`,lines:[{name:`Отец`,text:`Сергей Иванов, бывший полузащитник, ныне человек, который выключает трансляции. Слышишь? Не ходи туда. Город смеётся один раз, потом привыкает.`},{name:`Вася`,text:`Ты ушёл, потому что стало стыдно. Я ещё не начинал стыдиться.`},{name:`Отец`,text:`Я ушёл, потому что дед обещал нам чемпионство, а привёз домой тишину. Не обещай Ане то, чего нет в календаре.`},{name:`Аня`,text:`Он ничего не обещал. Он сказал, что доиграет. Это другое слово.`},{name:`Дед Иван`,text:`Серёжа, мальчик имеет право на свою ошибку. Нашу он уже видел.`},{name:`Вася`,text:`Я доиграю сезон здесь. Если место будет первое, второе или третье — мы это заслужили. Если ниже — я не стану делать вид, что кубок у нас в шкафу.`}]},{kind:`talk`,title:`Контракт`,place:`Кабинет над раздевалкой`,lines:[{name:`Михаил`,text:`Я ваш агент на этот год. Никаких сказок про большие клубы, пока вас не выпускают на табло.`},{name:`Тренер`,text:`Иванов, Волков мне понятен. Ты — риск с тяжёлой фамилией. Ошибаешься в выборе позиции, и сядешь так, что двор этого не увидит.`},{name:`Вася`,text:`Мне не нужна речь. Дайте минуты и не продавайте меня, пока сезон не закрыт.`},{name:`Глеб`,text:`Минуты ещё надо отнять. Я не буду тебе ассистировать из жалости.`},{name:`Тренер`,text:`Первый матч. Выйдешь. Дед на трибуне — его забота, не моя. Твоя забота — не спрятаться.`}]},{kind:`match`,title:`Дебют`,blurb:`Первый официальный матч. Управляете только Васей. Гол, ошибка и тишина после свистка останутся в истории, а не в речи тренера.`},{kind:`talk`,title:`Коридор`,place:`Под трибуной, мокрый бетон`,lines:[{name:`Тренер`,text:`Один матч ничего не пишет на кубке. Волков надёжнее. Ещё такой вечер — и ты смотришь следующий тур в куртке.`},{name:`Вася`,text:`Заметьте меня по игре, не по тому, что обо мне напишет город.`},{name:`Аня`,text:`Отец был на стадионе. Он ушёл до финального свистка. Сказал, что уже видел этот фильм.`},{name:`Отец`,text:`Я видел, как ты открылся. И видел, как ты оглянулся на трибуну. Игроки, которые оглядываются, не заканчивают сезоны.`},{name:`Михаил`,text:`Чебоксары уже звонили. Я сказал: он никуда не едет, пока не доиграет с этими людьми.`},{name:`Глеб`,text:`Доиграй хотя бы со мной. Пока ты соперник в своей раздевалке, городу на нас плевать.`}]},{kind:`match`,title:`Второй шанс`,blurb:`Тренер снова ставит вас в старт. Форма Васи растёт от голов и падает от пустых вечеров.`},{kind:`talk`,title:`Ночной звонок`,place:`Общага у манежа`,lines:[{name:`Михаил`,text:`Есть бумага. Чужой клуб, нормальные деньги, выезд на следующей неделе. Отец просил передать: уезжай, не повторяй его.`},{name:`Отец`,text:`Вася, я не умею болеть за своих. Я умею уходить, пока не стало поздно. Возьми контракт.`},{name:`Дед Иван`,text:`Человек, который бежит в октябре, не имеет права исчезать в мае. Сезон закрывают те, кто остаётся, когда таблица врёт и когда она говорит правду.`},{name:`Вася`,text:`Михаил, положи бумагу в ящик. Я запрошу трансфер, если захочу, только когда все сыграют со всеми. Не раньше.`},{name:`Аня`,text:`Я скажу отцу, что ты отказался. Пусть в этот раз дослушает сам.`}]},{kind:`talk`,title:`Раздевалка`,place:`После ничьей, которую никто не празднует`,lines:[{name:`Глеб`,text:`Ты взял удар на себя, хотя я был свободнее. Это не характер. Это страх отдать пас фамилии Волкова.`},{name:`Вася`,text:`А ты отдал назад, хотя я уже был в штрафной. Мы оба играем против призраков, Глеб.`},{name:`Аня`,text:`Хватит. Город и так ждёт, кто из вас сломается первым. Не делайте ему это одолжение в собственной раздевалке.`},{name:`Тренер`,text:`Завтра вы оба в основе. Не друзья. Партнёры. Если сорвётесь ещё раз, я сниму обоих, и сезон доиграет молодёжка.`},{name:`Глеб`,text:`Ладно. Бежишь в штрафную — я отдам. Один раз. Потом посмотрим, кто ты без деда на трибуне.`},{name:`Вася`,text:`Один раз мне хватит, чтобы не ненавидеть тебя до конца календаря.`}]},{kind:`match`,title:`Рывок`,blurb:`Середина сезона. Очки Васи остаются в протоколе. Кубка ещё нет: его не раздают, пока кто-то не сыграл.`},{kind:`talk`,title:`Канун`,place:`Пустой стадион накануне развязки`,lines:[{name:`Тренер`,text:`Этот матч ничего вам не обещает. Победа не печатает чемпионство. Поражение не вычёркивает сезон. После свистка календарь доиграют остальные туры — честно, без подтасовки таблицы.`},{name:`Михаил`,text:`Когда все клубы сыграют друг с другом, место будет видно. Первое, второе, третье — можно смотреть людям в глаза. Ниже — нет медали, и я не буду её рисовать.`},{name:`Отец`,text:`Я пришёл до свистка. Не проси меня кричать. Просто не прячься, если станет плохо.`},{name:`Дед Иван`,text:`Я могу не достоять весь матч. Не оглядывайся проверять. Если я уйду в туннель, это возраст, не приговор.`},{name:`Аня`,text:`Мы будем там все. Даже если город решит, что Ивановым снова рано.`},{name:`Глеб`,text:`Бери мяч. Я закрою край. Сегодня мы не двор и не сплетня.`},{name:`Вася`,text:`Тогда играем до конца. Место пусть назовёт таблица, не я.`}]},{kind:`match`,title:`Развязка`,blurb:`Матч идёт в таблицу как есть: победа, ничья или поражение. Потом сезон доигрывается сам. Финал истории зависит от места, а не от одной речи.`,final:!0}];function Qt(e){return e===1?{title:`Золотой свисток`,where:`Поле после чемпионского круга`,happy:!0,lines:[{name:`Тренер`,text:`Иванов, ты начал сезон как риск с тяжёлой фамилией. Таблица закрыта, все сыграли со всеми, и кубок лиги стоит здесь. Не потому что я так решил. Потому что очков больше нет ни у кого.`},{name:`Глеб`,text:`Я хотел быть первым, кто тебя обойдёт. Сегодня город стоит из-за тебя. В следующем сезоне я снова попробую. Сегодня — твоё золото.`},{name:`Отец`,text:`Я уходил, чтобы надо мной не смеялись. Теперь они встают. Я не знаю, что с этим делать, Вася. Я просто не уйду раньше свистка в следующий раз.`},{name:`Дед Иван`,text:`Вот теперь фамилия держится до конца, а не до первой неудачи. Я достоял. Слышишь? Достоял.`},{name:`Аня`,text:`Не оставляй мяч в том дворе. И не делай вид, что это был только ты. Глеб бежал. Отец вернулся. Дед не сел.`},{name:`Михаил`,text:`Предложения я сложу в тот же ящик. Уйти можно будет только если сам попросишь в конце следующего сезона. Переходы, которые уже случились, никуда не денутся.`},{name:`Вася`,text:`Мы взяли лигу. Не я один. Золото настоящее, потому что календарь не соврали. Можно начинать новый сезон: победы этого года останутся в статистике.`}]}:e===2?{title:`Серебро на ладони`,where:`Раздевалка, форму ещё не сняли`,happy:!0,lines:[{name:`Тренер`,text:`Второе место. Не чемпионство и не анекдот, которым город пугал Ивановых. Серебро весит. Его не стыдно принести домой.`},{name:`Глеб`,text:`Я злился весь год, что ты оказался не слабее. Сегодня злость короче медали. В следующем сезоне я заберу у тебя это серебро и попробую на золото.`},{name:`Отец`,text:`Второе — не провал. Это обещание, которое не пришлось выдумывать. Я смотрел до конца. Мне было страшно. Я всё равно смотрел.`},{name:`Дед Иван`,text:`Я хотел кубок. Я получил внука, который не сбежал, когда стало ясно, что первого места может не быть. Это тоже золото, только другого сплава.`},{name:`Аня`,text:`Сфотографируй медаль, пока руки не дрожат. Потом начнём год заново. Состав, в котором вы доиграли, пусть останется тем, чем его сделали трансферы.`},{name:`Вася`,text:`Мы не чемпионы. Мы и не те Ивановы, которые уходят в октябре. Серебро — счастливый финал для двора, которому обещали пустоту. Новый сезон я начинаю отсюда.`}]}:e===3?{title:`Бронза`,where:`Туннель, свет ещё не выключили`,happy:!0,lines:[{name:`Михаил`,text:`Третье. Пьедестал узкий, фотография существует. Предложения будут. Я их не подпишу, пока ты сам не скажешь в конце следующего лета.`},{name:`Тренер`,text:`Бронза не кормит газеты так, как золото. Зато она честная: все клубы сыграли, и вы остались в первой тройке. Мне этого хватает, чтобы назвать сезон удачным.`},{name:`Глеб`,text:`Я хотел выше. Ты тоже. Мы не дотянули до серебра и не провалились в середину. Завтра я снова буду спорить с тобой в раздевалке. Сегодня можно помолчать.`},{name:`Отец`,text:`Третье место — это когда город не смеётся и не орёт. Он просто кивает. Я всю жизнь ждал либо крика, либо тишины. Кивок оказался лучше.`},{name:`Дед Иван`,text:`Положи бронзу на кухонный стол. Пусть стоит, пока мы не вырастем до чего-то тяжелее. Я не называю это неудачей. Я называю это финалом, который можно пережить.`},{name:`Аня`,text:`Счастливый конец бывает не только с кубком над головой. Бывает с медалью в кармане и с отцом, который не ушёл.`},{name:`Вася`,text:`Я дослушал свисток. Третье место — наш счастливый финал. Победы этого сезона запишутся. Трансферы тоже. Новый круг начнётся с того состава, который есть, а не с того, который был в августе.`}]}:{title:`Пустая полка`,where:`Ночной автобус со стадиона`,happy:!1,lines:[{name:`Тренер`,text:`Таблица закрыта честно. Мы ${e>0?`${e}-е`:`место ниже тройки`}. Ни золота, ни серебра, ни бронзы. Я не буду переписывать чужие результаты, чтобы стало красиво.`},{name:`Глеб`,text:`Лига нам ничего не должна. Я бежал. Ты бежал. Этого не хватило на пьедестал. Ненавижу этот счёт, но он настоящий.`},{name:`Михаил`,text:`Жалость в газету не кладут. Клубы, которые уже купили наших, не вернут людей назад. Статистика побед тоже не сотрётся. Сотрётся только ощущение, что этот год кончился хорошо.`},{name:`Отец`,text:`Вот эта ночь. Та, из которой я всю жизнь уходил. Ты в ней остался. Мне от этого не легче смотреть на пустую полку, но я хотя бы сижу рядом.`},{name:`Дед Иван`,text:`Я хотел кубок. Я увидел, как ты доиграл. Это не счастливый финал, Вася. Не ври себе, что четвёртое и ниже — тоже медаль. Не ври и что жизнь кончилась на этой остановке.`},{name:`Аня`,text:`Можно начать всё заново. Город никуда не денется. Игроки, которые перешли, останутся там, куда перешли. Победы, которые уже были, останутся в архиве. Просто этот сезон мы не празднуем.`},{name:`Вася`,text:`Я не назову это трофеем. Мы ниже первых трёх, и финал неудачный. Но я не брошу календарь на половине. Начнём сезон снова — с теми же переходами и с той статистикой, которую уже заслужили. В этот раз я хочу достоять до медали.`}]}}function $t({state:e,onChange:t,onPlay:n,onSimulate:r,onMenu:i,onReset:a}){let o=Zt[e.step],s=E(e.career.teamId),c=ut(e.career),l=e.career.people.find(t=>t.id===e.career.createdId);if(c)return(0,p.jsx)(en,{state:e,onMenu:i,onReset:a,onChange:t,onRestart:()=>{let n=pt(e.career);t(typeof n==`string`?{...e,note:n}:{...e,teamId:n.teamId,step:0,rigged:!1,note:``,career:n})}});if(!o)return(0,p.jsxs)(`main`,{className:`safe-top safe-bot mx-auto min-h-dvh w-full max-w-3xl px-4 py-6`,children:[(0,p.jsx)(`button`,{className:`text-sm text-mint`,onClick:i,children:`Меню`}),(0,p.jsx)(`h2`,{className:`font-display mt-3 text-3xl uppercase`,children:`Глава кончилась раньше таблицы`}),(0,p.jsx)(`p`,{className:`mt-2 text-sm text-fg/70`,children:`Сезон ещё не закрыт, поэтому финала нет. Доиграйте календарь из карьеры или вернитесь к последнему матчу.`})]});if(o.kind===`talk`)return(0,p.jsxs)(p.Fragment,{children:[(0,p.jsx)(tn,{title:o.title,place:o.place,lines:o.lines,clubId:s.id,season:e.career.season||1,onMenu:i,onDone:()=>t({...e,step:e.step+1,note:``})}),(0,p.jsx)(`div`,{className:`mx-auto w-full max-w-3xl px-4 pb-10`,children:(0,p.jsx)(nn,{state:e,onChange:t})})]});let u=lt(e.career),d=u?u.fixture.home===e.career.teamId?u.fixture.away:u.fixture.home:``;return(0,p.jsxs)(`main`,{className:`safe-top safe-bot mx-auto flex min-h-dvh w-full max-w-3xl flex-col px-4 py-6`,children:[(0,p.jsx)(`button`,{className:`text-sm text-mint`,onClick:i,children:`Меню`}),(0,p.jsxs)(`p`,{className:`mt-4 font-display text-xs tracking-widest text-mint uppercase`,children:[`История · сезон `,e.career.season||1,` · `,s.name]}),(e.career.season||1)>1&&(0,p.jsx)(`p`,{className:`mt-1 text-sm text-fg/70`,chi
